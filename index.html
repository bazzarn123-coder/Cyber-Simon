<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Simon - 3D Memory Game</title>
    <!-- Self-contained SVG Favicon for Browser Address Bar -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23050507'/><path d='M50 50 L50 4 A 46 46 0 0 1 96 50 Z' fill='%23e53935'/><path d='M50 50 L96 50 A 46 46 0 0 1 50 96 Z' fill='%2300a2e8'/><path d='M50 50 L50 96 A 46 46 0 0 1 4 50 Z' fill='%23ffcc00'/><path d='M50 50 L4 50 A 46 46 0 0 1 50 4 Z' fill='%2300c853'/></svg>">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts Inter & Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1e293b;
            color: #f8fafc;
            overflow: hidden;
            touch-action: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.15);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }
    </style>
</head>
<body class="w-screen h-screen relative select-none">

    <!-- Three.js Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- UI Overlay Header / HUD -->
    <header class="absolute top-4 left-0 right-0 z-10 flex justify-between items-center px-6 pointer-events-none max-w-6xl mx-auto w-full">
        <div class="glass-panel rounded-2xl px-5 py-3 flex items-center space-x-4 pointer-events-auto">
            <div>
                <p id="p1-score-label" class="text-xs uppercase tracking-widest text-cyan-400 font-orbitron font-bold">Score</p>
                <p id="score-display" class="text-3xl font-black font-orbitron text-cyan-400">0</p>
            </div>
        </div>

        <div class="text-center pointer-events-auto">
            <h1 class="text-2xl md:text-3xl font-black tracking-widest font-orbitron glow-text text-cyan-400">CYBER SIMON</h1>
        </div>

        <div class="glass-panel rounded-2xl px-5 py-3 flex items-center space-x-4 pointer-events-auto">
            <div class="text-right">
                <p id="p2-score-label" class="text-xs uppercase tracking-widest text-slate-400 font-orbitron">High Score</p>
                <p id="high-score-display" class="text-3xl font-black font-orbitron text-amber-400">0</p>
            </div>
        </div>
    </header>

    <!-- Center Board Instructions (Boxless, Perfectly Centered on Hub) -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none text-center max-w-[200px]">
        <p id="status-text" class="text-[10px] md:text-xs font-bold tracking-widest text-slate-300 uppercase font-orbitron drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">Press Start</p>
    </div>

    <!-- Round Indicator & Controls Sub-header -->
    <div class="absolute top-24 left-1/2 -translate-x-1/2 z-10 flex items-center space-x-3 pointer-events-auto">
        <div class="glass-panel px-4 py-1.5 rounded-full text-xs font-orbitron tracking-widest text-slate-300 pointer-events-none">
            ROUND <span id="round-display" class="text-cyan-400 font-bold">1</span>
        </div>
        <button onclick="toggleCameraView()" id="cam-btn" class="glass-panel px-3 py-1.5 rounded-full text-xs font-orbitron tracking-wider text-cyan-300 hover:bg-cyan-500/20 transition-all">
            CAM: TOP DOWN
        </button>
        <button onclick="returnToMenu()" class="glass-panel px-3 py-1.5 rounded-full text-xs font-orbitron tracking-wider text-rose-400 hover:bg-rose-500/20 transition-all">
            MENU
        </button>
    </div>

    <!-- Zoom & Camera Settings Bar (Lifted safely above bottom nav bar) -->
    <div class="absolute left-6 z-10 glass-panel p-4 rounded-2xl flex flex-col space-y-2 pointer-events-auto max-w-xs w-full" style="bottom: calc(5rem + env(safe-area-inset-bottom, 0px));">
        <div class="flex justify-between items-center text-xs font-orbitron text-slate-300">
            <span>ZOOM DISTANCE</span>
            <span id="zoom-val" class="text-cyan-400">1.6x</span>
        </div>
        <input type="range" id="zoom-slider" min="0.6" max="2.0" step="0.05" value="1.6" oninput="adjustZoom(this.value)" class="w-full accent-cyan-400 cursor-pointer">
    </div>

    <!-- Start Screen Overlay -->
    <div id="start-screen" class="absolute inset-0 z-20 flex items-center justify-center bg-slate-950/85 backdrop-blur-md">
        <div class="glass-panel max-md:mx-4 p-8 md:p-10 rounded-3xl text-center max-w-md w-full border border-cyan-500/40 shadow-2xl">
            <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-cyan-500/10 border border-cyan-500/40 flex items-center justify-center overflow-hidden">
                <!-- Self-contained SVG Simon Icon matching the physical device -->
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23050507'/><path d='M50 50 L50 4 A 46 46 0 0 1 96 50 Z' fill='%23e53935'/><path d='M50 50 L96 50 A 46 46 0 0 1 50 96 Z' fill='%2300a2e8'/><path d='M50 50 L50 96 A 46 46 0 0 1 4 50 Z' fill='%23ffcc00'/><path d='M50 50 L4 50 A 46 46 0 0 1 50 4 Z' fill='%2300c853'/><circle cx='50' cy='50' r='18' fill='%23050507'/></svg>" alt="Simon Device" class="w-12 h-12 object-contain">
            </div>
            <h2 class="text-3xl font-black font-orbitron tracking-wider text-white mb-2">CYBER SIMON</h2>
            <p class="text-slate-400 text-sm mb-6 leading-relaxed">
                Test your neural memory capacity. Choose your mode and repeat the pattern.
            </p>

            <!-- Mode Selector -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="setGameMode(1)" id="mode-1-btn" class="py-3 rounded-xl font-orbitron font-bold text-xs tracking-wider bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/30 transition-all">
                    1 PLAYER
                </button>
                <button onclick="setGameMode(2)" id="mode-2-btn" class="py-3 rounded-xl font-orbitron font-bold text-xs tracking-wider bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition-all">
                    2 PLAYERS
                </button>
            </div>

            <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 font-orbitron font-bold text-white tracking-widest shadow-lg shadow-cyan-500/30 hover:scale-[1.02] active:scale-[0.98] transition-all">
                INITIALIZE GAME
            </button>
        </div>
    </div>

    <!-- Game Over Screen Overlay -->
    <div id="game-over-screen" class="absolute inset-0 z-20 flex items-center justify-center bg-slate-950/90 backdrop-blur-md hidden">
        <div class="glass-panel max-md:mx-4 p-8 md:p-10 rounded-3xl text-center max-w-md w-full border border-rose-500/40 shadow-2xl">
            <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-rose-500/10 border border-rose-500/40 flex items-center justify-center text-rose-400 text-3xl font-black font-orbitron">
                ⚠️
            </div>
            <h2 id="game-over-title" class="text-3xl font-black font-orbitron tracking-wider text-rose-400 mb-2">SYSTEM FAILURE</h2>
            <p id="game-over-subtitle" class="text-slate-400 text-sm mb-6">Incorrect neural pattern detected.</p>
            
            <div class="bg-slate-900/80 rounded-2xl p-4 mb-8 border border-slate-800">
                <p id="game-over-score-label" class="text-xs uppercase tracking-widest text-slate-400 font-orbitron">Final Score</p>
                <p id="final-score" class="text-4xl font-black font-orbitron text-white mt-1">0</p>
            </div>

            <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-rose-500 to-orange-600 font-orbitron font-bold text-white tracking-widest shadow-lg shadow-rose-500/30 hover:scale-[1.02] active:scale-[0.98] transition-all">
                RESTART SEQUENCE
            </button>
        </div>
    </div>

    <!-- Game Logic Script -->
    <script>
        // --- Web Audio API Synthesizer ---
        let audioCtx = null;
        const frequencies = [415.3, 310.4, 252.4, 209.3]; // Green, Red, Yellow, Blue tones

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration = 300) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration / 1000);
        }

        function playBuzzer() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(130, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.4);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- Three.js Environment & Variables ---
        let scene, camera, renderer, pads = [], activeParticles = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        let gameMode = 1; // 1 or 2 players
        let currentPlayer = 1;
        let p1Score = 0;
        let p2Score = 0;
        let p1HighScore = parseInt(localStorage.getItem('cyber_simon_hi_1p')) || 0;
        
        let gameSequence = [];
        let playerIndex = 0;
        let round = 0;
        let gameState = 'IDLE'; 
        let padAnimations = [ { progress: 0 }, { progress: 0 }, { progress: 0 }, { progress: 0 } ];

        // Default camera settings matching your preference
        let cameraMode = 'TOP';
        let baseZoomMultiplier = 1.6;

        const roundEl = document.getElementById('round-display');
        const scoreEl = document.getElementById('score-display');
        const highScoreEl = document.getElementById('high-score-display');
        const p1ScoreLabel = document.getElementById('p1-score-label');
        const p2ScoreLabel = document.getElementById('p2-score-label');
        const statusTextEl = document.getElementById('status-text');
        const startScreenEl = document.getElementById('start-screen');
        const gameOverScreenEl = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const camBtn = document.getElementById('cam-btn');
        const zoomValEl = document.getElementById('zoom-val');

        highScoreEl.innerText = p1HighScore;

        function setGameMode(mode) {
            gameMode = mode;
            const btn1 = document.getElementById('mode-1-btn');
            const btn2 = document.getElementById('mode-2-btn');
            if (mode === 1) {
                btn1.className = "py-3 rounded-xl font-orbitron font-bold text-xs tracking-wider bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/30 transition-all";
                btn2.className = "py-3 rounded-xl font-orbitron font-bold text-xs tracking-wider bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition-all";
            } else {
                btn2.className = "py-3 rounded-xl font-orbitron font-bold text-xs tracking-wider bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/30 transition-all";
                btn1.className = "py-3 rounded-xl font-orbitron font-bold text-xs tracking-wider bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition-all";
            }
        }

        function returnToMenu() {
            gameState = 'IDLE';
            startScreenEl.classList.remove('hidden');
            gameOverScreenEl.classList.add('hidden');
            statusTextEl.innerText = "PRESS START";
        }

        function createWedgeGeometry(startAngle, endAngle, innerRadius, outerRadius, depth) {
            const shape = new THREE.Shape();
            const segments = 32;

            for (let i = 0; i <= segments; i++) {
                const theta = startAngle + (endAngle - startAngle) * (i / segments);
                const x = Math.cos(theta) * outerRadius;
                const y = Math.sin(theta) * outerRadius;
                if (i === 0) shape.moveTo(x, y);
                else shape.lineTo(x, y);
            }

            for (let i = segments; i >= 0; i--) {
                const theta = startAngle + (endAngle - startAngle) * (i / segments);
                const x = Math.cos(theta) * innerRadius;
                const y = Math.sin(theta) * innerRadius;
                shape.lineTo(x, y);
            }
            shape.closePath();

            const extrudeSettings = {
                depth: depth,
                bevelEnabled: true,
                bevelSegments: 3,
                steps: 1,
                bevelSize: 0.06,
                bevelThickness: 0.06
            };

            const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geom.rotateX(Math.PI / 2);
            return geom;
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            updateCameraTransform();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(6, 16, 6);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Darker Black Body Housing
            const baseGeo = new THREE.CylinderGeometry(4.7, 4.8, 0.4, 64);
            const baseMat = new THREE.MeshStandardMaterial({
                color: 0x050507,
                roughness: 0.5,
                metalness: 0.2
            });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.y = -0.22;
            baseMesh.receiveShadow = true;
            scene.add(baseMesh);

            // Central Hub Console
            const hubGeo = new THREE.CylinderGeometry(1.6, 1.8, 0.45, 32);
            const hubMat = new THREE.MeshStandardMaterial({
                color: 0x050507,
                metalness: 0.8,
                roughness: 0.3
            });
            const hub = new THREE.Mesh(hubGeo, hubMat);
            hub.position.y = -0.15;
            hub.receiveShadow = true;
            scene.add(hub);

            // Exact Physical Simon Game Colors
            const padConfigs = [
                { color: 0x00c853, dimColor: 0x00702d, angleStart: Math.PI * 0.5 + 0.04, angleEnd: Math.PI - 0.04, name: 'Green' },
                { color: 0xe53935, dimColor: 0x8a1c19, angleStart: 0.04, angleEnd: Math.PI * 0.5 - 0.04, name: 'Red' },
                { color: 0xffcc00, dimColor: 0x997a00, angleStart: Math.PI + 0.04, angleEnd: Math.PI * 1.5 - 0.04, name: 'Yellow' },
                { color: 0x00a2e8, dimColor: 0x005c8a, angleStart: Math.PI * 1.5 + 0.04, angleEnd: Math.PI * 2.0 - 0.04, name: 'Blue' }
            ];

            padConfigs.forEach((config, index) => {
                const geom = createWedgeGeometry(config.angleStart, config.angleEnd, 1.9, 4.6, 0.35);
                const mat = new THREE.MeshBasicMaterial({
                    color: config.dimColor
                });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.userData = { id: index };

                scene.add(mesh);
                pads.push({ mesh: mesh, config: config });
            });

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);

            animate();
        }

        function updateCameraTransform() {
            if (cameraMode === 'PERSPECTIVE') {
                camera.position.set(0, 9 * baseZoomMultiplier, 11 * baseZoomMultiplier);
                camera.lookAt(0, -0.2, 0);
                camBtn.innerText = "CAM: 3D PERSPECTIVE";
            } else {
                camera.position.set(0, 13.5 * baseZoomMultiplier, 0.01);
                camera.lookAt(0, 0, 0);
                camBtn.innerText = "CAM: TOP DOWN";
            }
            zoomValEl.innerText = baseZoomMultiplier.toFixed(1) + 'x';
        }

        function toggleCameraView() {
            cameraMode = (cameraMode === 'PERSPECTIVE') ? 'TOP' : 'PERSPECTIVE';
            updateCameraTransform();
        }

        function adjustZoom(val) {
            baseZoomMultiplier = parseFloat(val);
            updateCameraTransform();
        }

        function spawnParticles(padIndex, colorHex) {
            const pad = pads[padIndex];
            const particleCount = 22;
            const geom = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];

            const midAngle = (pad.config.angleStart + pad.config.angleEnd) / 2;
            const r = 3.2;
            const cx = Math.cos(midAngle) * r;
            const cz = Math.sin(midAngle) * r;

            for (let i = 0; i < particleCount; i++) {
                positions.push(cx, 0.4, cz);
                const speed = 0.05 + Math.random() * 0.08;
                const angle = midAngle + (Math.random() - 0.5) * 0.9;
                velocities.push({
                    x: Math.cos(angle) * speed,
                    y: 0.08 + Math.random() * 0.1,
                    z: Math.sin(angle) * speed
                });
            }

            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: colorHex,
                size: 0.28,
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending
            });

            const pSystem = new THREE.Points(geom, mat);
            scene.add(pSystem);
            activeParticles.push({ system: pSystem, velocities: velocities, life: 1.0 });
        }

        function updateParticles(delta) {
            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const p = activeParticles[i];
                p.life -= delta * 2.2;
                if (p.life <= 0) {
                    scene.remove(p.system);
                    p.system.geometry.dispose();
                    p.system.material.dispose();
                    activeParticles.splice(i, 1);
                } else {
                    const pos = p.system.geometry.attributes.position;
                    const arr = pos.array;
                    for (let j = 0; j < p.velocities.length; j++) {
                        arr[j * 3] += p.velocities[j].x;
                        arr[j * 3 + 1] += p.velocities[j].y;
                        arr[j * 3 + 2] += p.velocities[j].z;
                        p.velocities[j].y -= 0.007;
                    }
                    pos.needsUpdate = true;
                    p.system.material.opacity = p.life;
                }
            }
        }

        function activatePad(index, duration = 300) {
            playTone(frequencies[index], duration);
            spawnParticles(index, pads[index].config.color);

            pads[index].mesh.material.color.setHex(pads[index].config.color);
            padAnimations[index].progress = 1.0;

            setTimeout(() => {
                pads[index].mesh.material.color.setHex(pads[index].config.dimColor);
            }, duration);
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            pads.forEach((p, idx) => {
                if (padAnimations[idx].progress > 0) {
                    padAnimations[idx].progress -= delta * 6;
                    const val = Math.max(0, padAnimations[idx].progress);
                    p.mesh.position.y = -Math.sin(val * Math.PI) * 0.22;
                } else {
                    p.mesh.position.y = 0;
                }
            });

            updateParticles(delta);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function onPointerDown(e) {
            if (gameState !== 'PLAYER_TURN') return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pads.map(p => p.mesh));

            if (intersects.length > 0) {
                const intersectedMesh = intersects[0].object;
                const padId = intersectedMesh.userData.id;
                handlePlayerInput(padId);
            }
        }

        // --- Game Flow & Turn Logic ---
        function startGame() {
            initAudio();
            gameSequence = [];
            round = 0;
            p1Score = 0;
            p2Score = 0;
            currentPlayer = 1;

            updateScoreLabels();
            startScreenEl.classList.add('hidden');
            gameOverScreenEl.classList.add('hidden');
            nextRound();
        }

        function updateScoreLabels() {
            if (gameMode === 1) {
                p1ScoreLabel.innerText = "SCORE";
                p2ScoreLabel.innerText = "HIGH SCORE";
                scoreEl.innerText = p1Score;
                highScoreEl.innerText = p1HighScore;
            } else {
                p1ScoreLabel.innerText = "PLAYER 1";
                p2ScoreLabel.innerText = "PLAYER 2";
                scoreEl.innerText = p1Score;
                highScoreEl.innerText = p2Score;
            }
        }

        function nextRound() {
            if (gameState === 'IDLE' && startScreenEl.classList.contains('hidden') === false) return;
            round++;
            roundEl.innerText = round;
            playerIndex = 0;
            gameState = 'COMPUTER_TURN';

            const turnPrefix = (gameMode === 2) ? `P${currentPlayer}: ` : '';
            statusTextEl.innerText = turnPrefix + "OBSERVE";
            statusTextEl.className = "text-[10px] md:text-xs font-bold tracking-widest text-amber-400 uppercase font-orbitron drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] animate-pulse";

            const nextPad = Math.floor(Math.random() * 4);
            gameSequence.push(nextPad);

            playSequence();
        }

        function playSequence() {
            let i = 0;
            const speed = Math.max(260, 520 - (round * 12));
            const gap = speed * 0.55;

            const interval = setInterval(() => {
                if (gameState === 'IDLE') {
                    clearInterval(interval);
                    return;
                }
                if (i < gameSequence.length) {
                    activatePad(gameSequence[i], speed);
                    i++;
                } else {
                    clearInterval(interval);
                    if (gameState === 'IDLE') return;
                    gameState = 'PLAYER_TURN';
                    const turnPrefix = (gameMode === 2) ? `P${currentPlayer}: ` : '';
                    statusTextEl.innerText = turnPrefix + "YOUR TURN";
                    statusTextEl.className = "text-[10px] md:text-xs font-bold tracking-widest text-emerald-400 uppercase font-orbitron drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]";
                }
            }, speed + gap);
        }

        function handlePlayerInput(padIndex) {
            activatePad(padIndex, 250);

            if (padIndex === gameSequence[playerIndex]) {
                playerIndex++;
                
                if (gameMode === 1) {
                    p1Score = playerIndex;
                    scoreEl.innerText = p1Score;
                } else {
                    if (currentPlayer === 1) {
                        p1Score = playerIndex;
                        scoreEl.innerText = p1Score;
                    } else {
                        p2Score = playerIndex;
                        highScoreEl.innerText = p2Score;
                    }
                }

                if (playerIndex === gameSequence.length) {
                    gameState = 'ROUND_TRANSITION';
                    statusTextEl.innerText = "MATCHED";
                    statusTextEl.className = "text-[10px] md:text-xs font-bold tracking-widest text-cyan-400 uppercase font-orbitron drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]";

                    if (gameMode === 1 && p1Score > p1HighScore) {
                        p1HighScore = p1Score;
                        localStorage.setItem('cyber_simon_hi_1p', p1HighScore);
                        highScoreEl.innerText = p1HighScore;
                    }

                    setTimeout(() => {
                        if (gameState === 'IDLE') return;
                        if (gameMode === 2) {
                            currentPlayer = (currentPlayer === 1) ? 2 : 1;
                            updateScoreLabels();
                        }
                        nextRound();
                    }, 1100);
                }
            } else {
                gameOver();
            }
        }

        function gameOver() {
            gameState = 'GAME_OVER';
            statusTextEl.innerText = "FAILED";
            statusTextEl.className = "text-[10px] md:text-xs font-bold tracking-widest text-rose-500 uppercase font-orbitron drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]";

            playBuzzer();

            const titleEl = document.getElementById('game-over-title');
            const subEl = document.getElementById('game-over-subtitle');
            const finalScoreLabel = document.getElementById('game-over-score-label');

            if (gameMode === 1) {
                titleEl.innerText = "SYSTEM FAILURE";
                subEl.innerText = "Incorrect neural pattern detected.";
                finalScoreLabel.innerText = "FINAL SCORE";
                finalScoreEl.innerText = p1Score;
            } else {
                titleEl.innerText = `PLAYER ${currentPlayer} FAILS`;
                subEl.innerText = `Player ${currentPlayer} missed the sequence.`;
                finalScoreLabel.innerText = `P1: ${p1Score} | P2: ${p2Score}`;
                finalScoreEl.innerText = (p1Score > p2Score) ? "PLAYER 1 WINS!" : (p2Score > p1Score) ? "PLAYER 2 WINS!" : "IT'S A TIE!";
            }

            gameOverScreenEl.classList.remove('hidden');
        }

        window.onload = initThree;
    </script>
</body>
</html>
